
name: System-Diagnostics-Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-run:
    name: Windows System Diagnostics
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Initialize Environment
        shell: pwsh
        run: |
          Write-Host "Initializing Windows diagnostics..."
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "PowerShell version:"
          $PSVersionTable.PSVersion

      - name: Collect System Information
        shell: pwsh
        run: |
          Write-Host "Operating System:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host "Processor:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores

          Write-Host "Memory:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,
                          FreePhysicalMemory

      - name: Check Network Connectivity
        shell: pwsh
        run: |
          Write-Host "Checking HTTPS connectivity..."
          Test-NetConnection github.com -Port 443 |
            Select-Object ComputerName,
                          RemotePort,
                          TcpTestSucceeded

      - name: System Stability Wait
        shell: pwsh
        run: |
          Write-Host "Running system diagnostic monitoring."

          $duration = 60
          $elapsed = 0

          while ($elapsed -lt $duration) {
            Write-Host "Diagnostics active: $elapsed seconds elapsed"
            Start-Sleep -Seconds 10
            $elapsed += 10
          }

          Write-Host "Diagnostic monitoring completed."

      - name: Finish Diagnostics
        if: always()
        shell: pwsh
        run: |
          Write-Host "Windows diagnostics workflow finished."
